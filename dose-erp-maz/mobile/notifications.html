<script>
/* TODO: รายการแจ้งเตือนจริงมาจากตารางแจ้งเตือนของผู้ใช้ ตอนนี้เป็นข้อมูลตัวอย่างของบทบาทบัญชีและบุคคล
   แตะรายการ = อ่านแล้ว แล้วไปหน้าของเรื่องนั้น / "อ่านทั้งหมด" = ล้างจุดแดงทุกรายการ */
(function(){
  function read(a){ a.classList.remove('unread'); var d=a.querySelector('.nt-dot'); if(d) d.remove(); }
  document.addEventListener('click',function(e){ var a=e.target.closest('.nt-item'); if(a) read(a); });
  document.getElementById('ntReadAll').addEventListener('click',function(){
    Array.prototype.forEach.call(document.querySelectorAll('.nt-item.unread'),read); this.disabled=true; this.style.opacity='.4';
  });
})();
</script>
