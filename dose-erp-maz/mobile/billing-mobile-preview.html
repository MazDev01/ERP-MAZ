<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;background:#EDE7E8}
iframe{width:390px;height:844px;border:0;border-radius:36px;background:#FBF5F4;box-shadow:0 30px 60px -30px rgba(80,20,30,.45)}
</style>
</head>
<body>
<iframe title="หน้าวางบิลบนมือถือ" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;th&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;title&gt;วางบิล — ERP MAZ&lt;/title&gt;
&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;
&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
:root{
  --maz-red:#D0021B; --maz-red-deep:#8E0012; --maz-red-bright:#E8253C;
  --ink:#1F2430; --ink-soft:#68707E; --ink-faint:#9AA1AE;
  --line:#E8EBF0; --field:#FAFBFC; --white:#FFF;
  --ok:#14875A;   --ok-bg:#E7F5EE;
  --late:#C0121F; --late-bg:#FDECEE;
  --early:#B4630B;--early-bg:#FDF2E3;
  --leave:#1A3E8C;--leave-bg:#E7ECF7;
  --miss:#6B7280; --miss-bg:#F1F3F6;
  --off:#8A919E;  --off-bg:#F1F3F6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:&#x27;Noto Sans Thai&#x27;,system-ui,sans-serif;color:var(--ink);background:#F4F5F8;display:flex}

/* ---------- sidebar ---------- */
.side{width:228px;flex:none;color:var(--white);position:relative;background:linear-gradient(170deg,var(--maz-red-bright),var(--maz-red) 42%,var(--maz-red-deep));display:flex;flex-direction:column;padding:24px 0 18px}
.side::before{content:&#x27;&#x27;;position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 1px,transparent 1px 44px),repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 1px,transparent 1px 44px);mask-image:linear-gradient(160deg,rgba(0,0,0,1) 8%,rgba(0,0,0,.3) 80%);-webkit-mask-image:linear-gradient(160deg,rgba(0,0,0,1) 8%,rgba(0,0,0,.3) 80%)}
.side &gt; *{position:relative;z-index:1}
.logo{padding:0 24px 18px;font-size:21px;font-weight:700;letter-spacing:.05em;flex:none}
.nav{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding:0 12px 12px;scrollbar-width:thin}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 13px;border-radius:10px;color:rgba(255,255,255,.82);text-decoration:none;font-size:13.5px;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,255,255,.12);color:var(--white)}
.nav a.on{background:var(--white);color:var(--maz-red);font-weight:600}
.nav svg{flex:none}
.grp{padding:12px 20px 5px;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.55)}
.grp:first-child{padding-top:0}

/* ---------- app bar ---------- */
.main{position:relative;flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.appbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 26px;background:var(--white);border-bottom:1px solid var(--line)}
.appbar .where{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;min-width:0}
.appbar .where svg{color:var(--ink-faint);flex:none}
.appbar .side-tools{display:flex;align-items:center;gap:9px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--white);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:none}
.iconbtn:hover{border-color:var(--ink-faint);color:var(--ink)}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--maz-red);border:1.5px solid var(--white)}
.me{display:flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--white);cursor:pointer;font-family:inherit;flex:none}
.me:hover{border-color:var(--maz-red)}
.me .av{width:30px;height:30px;border-radius:50%;background:#FCEBEE;color:var(--maz-red);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.menu{position:absolute;top:50px;right:26px;z-index:60;width:236px;background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -18px rgba(60,20,30,.34);padding:8px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s,transform .18s,visibility .18s}
.menu.on{opacity:1;visibility:visible;transform:none}
.mehead{display:flex;align-items:center;gap:11px;padding:8px 10px 10px}
.mehead .av{width:40px;height:40px;border-radius:50%;background:#FCEBEE;color:var(--maz-red);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none}
.mehead .tx{min-width:0}
.mehead .tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mehead .tx span{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.menu a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:13px;color:var(--ink);text-decoration:none}
.menu a:hover{background:#FDECEE;color:var(--maz-red)}
.menu a.out{color:var(--maz-red)}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 4px}

/* ---------- page ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 30px 0;flex-wrap:wrap}
.bar h1{font-size:23px;font-weight:700}
.bar p{margin-top:3px;font-size:13.5px;color:var(--ink-soft)}
.tools{display:flex;align-items:center;gap:10px}
.mo{display:flex;align-items:center;gap:2px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:3px}
.mo button{width:30px;height:30px;border:none;background:none;border-radius:8px;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center}
.mo button:hover:not(:disabled){background:var(--field);color:var(--ink)}
.mo button:disabled{opacity:.35;cursor:default}
.mo span{padding:0 12px;font-size:13.5px;font-weight:600;min-width:120px;text-align:center}
.btn{height:36px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--white);color:var(--ink-soft);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--ink-faint);color:var(--ink)}
.btn.solid{border:none;background:linear-gradient(100deg,var(--maz-red-bright),var(--maz-red-deep));color:var(--white);height:36px}
.btn.solid:hover{filter:brightness(1.06)}
.btn.solid.out{background:linear-gradient(100deg,#3B4657,#20293A)}
.btn.solid:disabled{cursor:default;background:#E7EAEF;color:var(--ink-faint);filter:none}



.panel{margin:16px 30px 22px;background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}
.strip{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 20px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:none;border:none;cursor:pointer;font-family:inherit;padding:14px 13px 12px;font-size:13.5px;font-weight:500;color:var(--ink-soft);border-bottom:2.5px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--maz-red);border-bottom-color:var(--maz-red);font-weight:600}
.tabs button b{margin-left:6px;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:9px;background:var(--field);color:var(--ink-faint)}
.tabs button.on b{background:#FCEBEE;color:var(--maz-red)}
.legend{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:11.5px;color:var(--ink-faint);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;flex:none}

.scroll{flex:1;min-height:0;overflow:auto}
.pages{display:flex;gap:5px}
.pages button{min-width:31px;height:31px;padding:0 8px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--white);font-family:inherit;font-size:13px;color:var(--ink-soft)}
.pages button.on{background:var(--maz-red);border-color:var(--maz-red);color:var(--white);font-weight:600}
.pages button:disabled{opacity:.35;cursor:default}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{position:sticky;top:0;background:var(--white);z-index:2}
th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-faint);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th.c,td.c{text-align:center}
th.r,td.r{text-align:right}
td{padding:12px 14px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.today{background:#FEF7F8}
.day b{font-weight:600;font-variant-numeric:tabular-nums}
.day span{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:1px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-faint)}
.diff{font-size:11.5px;font-weight:600;margin-left:6px}
.diff.late{color:var(--late)}
.diff.early{color:var(--early)}
.sub2{display:block;font-size:11px;color:var(--ink-faint);margin-top:1px;font-weight:400}

.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-late{background:var(--late-bg);color:var(--late)}
.t-early{background:var(--early-bg);color:var(--early)}
.t-leave{background:var(--leave-bg);color:var(--leave)}
.t-miss{background:var(--miss-bg);color:var(--miss)}

.foot{flex:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 20px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap}
.foot .sum{font-variant-numeric:tabular-nums}
.foot .sum b{color:var(--ink);font-weight:600;margin-left:6px}

:focus-visible{outline:2.5px solid var(--maz-red);outline-offset:3px}
@media (max-width:1180px){
  .side{width:74px}
  .logo{padding:0 0 22px;text-align:center;font-size:17px}
  .nav a span,.grp{display:none}
  .nav a{justify-content:center;padding:12px 0}
  th.hide,td.hide{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* ---------- เพิ่มเฉพาะหน้าการลา ---------- */
.mo span{min-width:150px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 30px 0}
.card{border-radius:16px;padding:15px 17px;background:var(--white);border:1px solid var(--line)}
.card .ct{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .ct b{font-size:13.5px;font-weight:600}
.card .ct em{font-style:normal;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--field);color:var(--ink-faint)}
.card .big{margin-top:9px;font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.card .big u{text-decoration:none;font-size:13px;font-weight:600;color:var(--ink-soft);margin-left:5px}
.card .meta{margin-top:3px;font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.card .track{display:block;height:5px;border-radius:4px;background:rgba(31,36,48,.09);margin-top:11px;overflow:hidden}
.card .track i{display:block;height:100%;border-radius:4px;background:var(--maz-red)}

.t-pend{background:var(--early-bg);color:var(--early)}
.t-appr{background:var(--ok-bg);color:var(--ok)}
.t-rej{background:var(--late-bg);color:var(--late)}
.t-cxl{background:var(--miss-bg);color:var(--miss)}

.over{display:block;margin-top:4px;font-size:11px;font-weight:600;color:var(--late);line-height:1.3}
.why{display:block;font-size:11px;color:var(--ink-faint);margin-top:2px}
.clip{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.span{display:block;white-space:nowrap}
.lnk{background:none;border:none;padding:0;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--maz-red);cursor:pointer}
.lnk:hover{text-decoration:underline}

/* ---------- กล่องยื่นใบลา ---------- */
.veil{position:fixed;inset:0;z-index:80;background:rgba(28,20,45,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s}
.veil.on{opacity:1;visibility:visible}
.box{width:100%;max-width:560px;max-height:100%;border-radius:18px;background:var(--white);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transform:translateY(8px);transition:transform .18s}
.veil.on .box{transform:none}
.bhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.bhead h2{font-size:16.5px;font-weight:700}
.bbody{flex:1;min-height:0;overflow:auto;padding:18px 20px}
.bfoot{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line)}
.fld{margin-bottom:15px}
.fld:last-child{margin-bottom:0}
.fld &gt; label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;height:38px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:var(--field);font-family:inherit;font-size:13.5px;color:var(--ink)}
textarea{height:78px;padding:9px 11px;resize:vertical;line-height:1.5}
select{cursor:pointer}
.seg{display:flex;gap:3px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;height:30px;border:none;background:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink-soft)}
.seg button.on{background:var(--white);color:var(--maz-red);font-weight:600;box-shadow:0 1px 3px rgba(28,20,45,.1)}
.calc{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border-radius:11px;background:var(--field);border:1px solid var(--line);font-size:13px}
.calc b{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.warn{margin-top:9px;padding:10px 13px;border-radius:11px;font-size:12.5px;line-height:1.55;background:var(--late-bg);color:var(--late);border:1px solid rgba(192,18,31,.2)}
.warn.hide{display:none}
.file{display:flex;align-items:center;gap:11px}
.file input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.file .pick{height:36px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink-soft);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;flex:none}
.file .pick:hover{border-color:var(--ink-faint);color:var(--ink)}
.file .fname{font-size:12.5px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{margin-top:7px;font-size:11.5px;color:var(--ink-faint);line-height:1.5}

/* ---------- ช่องติกเลือกช่วงครึ่งวัน ---------- */
.picks{display:flex;flex-direction:column;gap:2px}
.pickone{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink)}
.pickone:hover{background:rgba(31,36,48,.05)}
.pickone.on{color:var(--maz-red);font-weight:600}
.pickone input{-webkit-appearance:radio;appearance:radio;width:17px;height:17px;margin:0;padding:0;flex:none;accent-color:var(--maz-red);background:none;border:none;box-shadow:none;cursor:pointer}
.pickone em{font-style:normal;font-size:12px;color:var(--ink-faint);margin-left:auto;font-variant-numeric:tabular-nums}
.pickone.on em{color:var(--maz-red)}

/* ---------- ตัวเลือกวันที่แบบไทย ---------- */
.dwrap{position:relative}
.dwrap input{cursor:pointer;padding-right:36px}
.dwrap .calbtn{position:absolute;bottom:0;right:0;width:36px;height:38px;border:none;background:none;cursor:pointer;color:var(--ink-faint);display:flex;align-items:center;justify-content:center}
.dwrap .calbtn:hover{color:var(--maz-red)}
.cal{position:absolute;z-index:90;top:100%;margin-top:5px;left:0;width:276px;padding:12px;border-radius:14px;background:var(--white);border:1px solid var(--line);box-shadow:0 22px 46px -20px rgba(40,25,60,.42);display:none}
.cal.on{display:block}
.cal.up, .tpop.up{top:auto;bottom:100%;margin-top:0;margin-bottom:5px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.calhead b{font-size:13.5px;font-weight:600}
.calnav{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--white);cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex:none}
.calnav:hover{border-color:var(--ink-faint);color:var(--ink)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.calgrid span.dw{display:block;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-faint);padding:5px 0}
.calgrid button{height:32px;border:none;background:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.calgrid button:hover{background:var(--field)}
.calgrid button.off{color:var(--ink-faint)}
.calgrid button.hol{color:var(--late)}
.calgrid button.on{background:var(--maz-red);color:var(--white);font-weight:700}
.calgrid button.blank{visibility:hidden;cursor:default}

/* ---------- ตัวเลือกเวลาแบบ stepper ---------- */
.twrap{position:relative}
.twrap input{cursor:pointer;padding-right:36px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.twrap .clockbtn{position:absolute;bottom:0;right:0;width:36px;height:38px;border:none;background:none;cursor:pointer;color:var(--ink-faint);display:flex;align-items:center;justify-content:center}
.twrap .clockbtn:hover{color:var(--maz-red)}
.tpop{position:absolute;z-index:90;top:100%;margin-top:5px;left:0;padding:13px;border-radius:14px;background:var(--white);border:1px solid var(--line);box-shadow:0 22px 46px -20px rgba(40,25,60,.42);display:none}
.tpop.on{display:flex;align-items:flex-start;gap:8px}
.tcol{display:flex;flex-direction:column;align-items:center;gap:5px;width:78px}
.tcol .h{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:1px}
.tcol .step{width:34px;height:26px;border:none;background:none;border-radius:7px;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex:none}
.tcol .step:hover:not(:disabled){background:var(--field);color:var(--maz-red)}
.tcol .step:disabled{opacity:.28;cursor:default}
.tcol .val{display:block;width:100%;text-align:center;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;padding:7px 0;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
.tsep{font-size:21px;font-weight:700;color:var(--ink-faint);padding-top:47px}


/* ---------- เฉพาะหน้าโอที ---------- */
.cards.two-up{grid-template-columns:repeat(2,1fr)}
.adj{display:block;margin-top:4px;font-size:11px;font-weight:600;color:var(--early);line-height:1.3}

@media (max-width:900px){
  .cards{grid-template-columns:1fr;margin:14px 18px 0}
  .two{grid-template-columns:1fr}
}

/* ---------- เฉพาะหน้าเบิกค่าใช้จ่าย ---------- */
.strip .stat{margin-left:auto;padding-right:4px}
.form{padding:22px 26px 26px}
.ftitle{text-align:center;font-size:16px;font-weight:700}
.fsub{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:3px}
.meta{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px 26px}
.mrow{display:flex;align-items:center;gap:10px;font-size:13px}
.mrow &gt; span,.mrow &gt; label{flex:none;width:130px;color:var(--ink-soft);font-weight:600}
.mrow &gt; b{font-weight:600}
.mrow input{flex:1;min-width:0;height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--field);font-family:inherit;font-size:13px;color:var(--ink)}
.lead{margin-top:14px;font-size:13px;color:var(--ink-soft)}

table.grid{width:100%;border-collapse:collapse;margin-top:12px}
table.grid th{padding:9px 8px;background:var(--field);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-soft);text-align:left}
table.grid td{padding:5px 6px;border:1px solid var(--line);font-size:13px;vertical-align:middle}
table.grid th.c,table.grid td.c{text-align:center}
table.grid th.r,table.grid td.r{text-align:right}
table.grid td.num{font-variant-numeric:tabular-nums}
table.grid input{width:100%;height:32px;padding:0 8px;border:none;background:none;font-family:inherit;font-size:13px;color:var(--ink);outline:none}
table.grid input:focus{background:var(--white);box-shadow:inset 0 0 0 1.6px var(--maz-red);border-radius:7px}
table.grid input:disabled{color:var(--ink-soft)}
table.grid input.c{text-align:center}
table.grid input.r{text-align:right}
table.grid .f-date{cursor:pointer}
table.grid td.dcell{white-space:nowrap}
table.grid td.tsum{font-weight:700;background:var(--field)}
table.grid td.tsum.grand{color:var(--maz-red);font-size:14px}
table.grid .del{width:28px;height:28px;border-radius:7px;border:none;background:none;color:var(--ink-faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
table.grid .del:hover{color:var(--late);background:var(--late-bg)}
.btn.addrow{margin:0}
.note-red{margin-top:14px;font-size:12px;color:var(--late)}
.cal.tablecal{position:absolute;top:0;left:0;z-index:140}
@media (max-width:900px){ .meta{grid-template-columns:1fr} .form{padding:18px} }


/* ---------- เฉพาะหน้าวางบิล ---------- */
.box.wide{max-width:620px}
.who{font-size:13.5px;color:var(--ink);margin-bottom:14px;line-height:1.6}
.who .sm{font-size:12.5px;color:var(--ink-soft)}
tr.drow.can{cursor:pointer}
tr.drow.can:hover td{background:rgba(208,2,27,.04)}
tr.sub &gt; td{padding:0;background:var(--field)}
.subwrap{padding:14px 18px 16px}
.subttl{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:8px}
table.inner{width:100%;border-collapse:collapse;background:var(--white);border-radius:10px;overflow:hidden}
table.inner th{padding:8px 10px;background:var(--field);font-size:11.5px;font-weight:600;color:var(--ink-soft);text-align:left}
table.inner td{padding:9px 10px;border-top:1px solid var(--line);font-size:12.5px}
table.inner th.c,table.inner td.c{text-align:center}
table.inner th.r,table.inner td.r{text-align:right}
table.inner td.num{font-variant-numeric:tabular-nums}
td.blank{padding:46px;text-align:center;color:var(--ink-faint)}
/* ตารางนี้มีหลายคอลัมน์ ถ้าบีบให้พอดีจอแคบ ข้อความไทยจะถูกหั่นทีละตัวอักษร
   กำหนดความกว้างขั้นต่ำแล้วให้เลื่อนแนวนอนแทน อ่านง่ายกว่า */
.panel table{min-width:1040px}
.panel .scroll{overflow-x:auto}
.late{display:inline-block;margin-top:3px;padding:1px 9px;border-radius:20px;font-size:11.5px;font-weight:700;background:var(--late-bg);color:var(--late)}
.soon{display:inline-block;margin-top:3px;padding:1px 9px;border-radius:20px;font-size:11.5px;font-weight:700;background:var(--early-bg);color:var(--early)}
.planbar{margin-top:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.planbar #planDiff{margin:0 0 0 auto;text-align:right}
.okmsg{font-size:12.5px;font-weight:600;color:var(--ok)}
.badmsg{font-size:12.5px;font-weight:600;color:var(--late)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:34px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--white);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink-soft)}
.seg button.on{border-color:var(--maz-red);background:#FEF5F6;color:var(--maz-red);font-weight:600}
.cal.floatcal{position:absolute;top:0;left:0;z-index:140}
a.lnk{text-decoration:none}
@media (max-width:1100px){ .cards{grid-template-columns:repeat(2,1fr)} }
@media (max-width:640px){ .cards{grid-template-columns:1fr} }

/* แต่ละรายการอยู่คนละบรรทัด ไม่ใช้เครื่องหมายคั่น */
.il{display:block;line-height:1.6}
/* ตัวเลือกที่ถูกเลือกอยู่ในดรอปดาวน์ เป็นสีชมพูอ่อน */
select option:checked{
  background:#FDECEE linear-gradient(0deg,#FDECEE,#FDECEE);
  color:var(--maz-red);font-weight:600}
/* ================= glass theme ================= */
body{background:#F2F3F7}
body::before{
  content:&#x27;&#x27;;position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(38% 42% at 78% 6%,  rgba(255,64,92,.34),  transparent 68%),
    radial-gradient(34% 40% at 12% 18%, rgba(255,140,90,.26), transparent 66%),
    radial-gradient(42% 44% at 62% 88%, rgba(96,132,255,.28), transparent 68%),
    radial-gradient(36% 40% at 18% 82%, rgba(120,220,200,.24),transparent 66%),
    radial-gradient(30% 34% at 92% 60%, rgba(196,120,255,.22),transparent 66%),
    #F4F5F9;
  filter:blur(40px);
}
/* ชั้นฝ้าบางๆ ให้สีไม่จัดเกินและตัวหนังสืออ่านง่าย */
body::after{
  content:&#x27;&#x27;;position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:rgba(255,255,255,.34);
}

/* ---- พื้นผิวกระจก ---- */
.panel, .card, .kpi, .pcard, .revcard, .box, .edu-wrap{
  background:rgba(255,255,255,.46);
  backdrop-filter:blur(30px) saturate(190%);
  -webkit-backdrop-filter:blur(30px) saturate(190%);
  border:1px solid rgba(255,255,255,.58);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 -1px 0 rgba(255,255,255,.28),
    0 1px 2px rgba(28,20,45,.05),
    0 18px 40px -20px rgba(40,25,60,.30);
}
.appbar, .topbar{
  background:rgba(255,255,255,.52);
  backdrop-filter:blur(26px) saturate(190%);
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  border-bottom:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 8px 26px -20px rgba(40,25,60,.5);
}
.menu{
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(34px) saturate(200%);
  -webkit-backdrop-filter:blur(34px) saturate(200%);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 26px 54px -24px rgba(40,25,60,.45);
}
.search, .seg, .mo, .iconbtn, .me, .btn.ghost, .chip, .drop, .master, .opt, .pages button, .tabs, .sw{
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-color:rgba(255,255,255,.62);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}
.iconbtn:hover, .me:hover, .btn.ghost:hover, .chip:hover{background:rgba(255,255,255,.72)}
.chip.on, .opt.on, .seg button.on, .pages button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

/* ปุ่มหลักเป็นแก้วสีแดง ไม่ใช่สีทึบ */
.btn.solid, .add, .solid{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34), 0 12px 26px -12px rgba(208,2,27,.6);
}

/* ตารางโปร่ง เห็นชั้นสีด้านหลัง */
thead th{background:rgba(255,255,255,.62)!important;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
tbody tr:hover{background:rgba(255,255,255,.42)}
tr.sub td{background:rgba(255,255,255,.34)}
table.rounds, table.revs, table.inner{background:rgba(255,255,255,.5)}

/* ช่องกรอกทึบกว่าเล็กน้อยเพื่อให้อ่านง่าย */
input, select, textarea{
  background:rgba(255,255,255,.58);
  border-color:rgba(255,255,255,.7);
  box-shadow:inset 0 1px 2px rgba(40,25,60,.05);
}
input:hover, select:hover, textarea:hover{background:rgba(255,255,255,.72)}
input:focus, select:focus, textarea:focus{background:rgba(255,255,255,.92)}
input:disabled, input[readonly]{background:rgba(240,241,245,.62)}

/* กระดาษเอกสารต้องทึบ เพราะต้องพิมพ์จริง */
.paper{
  background:#FFF;backdrop-filter:none;-webkit-backdrop-filter:none;
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 2px 8px rgba(28,20,45,.06), 0 30px 66px -30px rgba(40,25,60,.45);
}

@supports not (backdrop-filter: blur(2px)){
  body::before{filter:none;opacity:.5}
  .panel,.card,.kpi,.pcard,.revcard,.box,.edu-wrap,.menu,.appbar,.topbar{background:rgba(255,255,255,.94)}
}
@media print{ body::before,body::after{display:none} }

/* ===== glass theme — ส่วนเพิ่ม (ใช้ร่วมทุกหน้า) ===== */
/* บล็อกด้านบนคลุมแค่ .panel .card .menu .appbar ฯลฯ ส่วนนี้เก็บของที่ตกสำรวจ
   ห้ามเขียน CSS ของหน้าไว้ใต้บล็อกนี้ ไม่งั้นจะไปทับธีมกระจก */

/* กล่องที่ลอยทับเนื้อหา ต้องทึบกว่าการ์ดพื้นหลัง ไม่งั้นตารางด้านหลังทะลุจนอ่านไม่ออก */
.drawer, .list, .tip, /* เมนูบัญชีลอยทับเนื้อหา ถ้าโปร่งจะเห็นข้อความข้างหลังทะลุจนอ่านยาก ต้องทึบ */
.menu{
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-color:rgba(31,36,48,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 26px 54px -24px rgba(40,25,60,.45);
}
.cal, .tpop{
  background:rgba(255,255,255,.93);
  backdrop-filter:blur(34px) saturate(200%);
  -webkit-backdrop-filter:blur(34px) saturate(200%);
  border-color:rgba(255,255,255,.8);
}
.box{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(36px) saturate(200%);
  -webkit-backdrop-filter:blur(36px) saturate(200%);
  border-color:rgba(255,255,255,.75);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 34px 70px -28px rgba(40,25,60,.5);
}

/* ปุ่มเล็กในตารางและแถบเครื่องมือ ให้เป็นแก้วระดับเดียวกับ .iconbtn */
.act, .del, .mini, .more, .calbar button, .file .rm, .b-line, .pick, .calnav, .tcol .val{
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-color:rgba(255,255,255,.62);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}
/* ไม่ใส่ .del:hover เพราะหน้าใบเสนอราคากำหนดพื้นแดงอ่อนตอน hover ไว้แล้ว */
.act:hover, .mini:hover, .more:hover, .calbar button:hover, .file .rm:hover, .b-line:hover, .pick:hover, .calnav:hover{
  background:rgba(255,255,255,.76);
}

/* ปฏิทินไทยและตัวเลือกเวลาแบบ stepper (หน้าการลา) */
.calgrid button:hover{background:rgba(31,36,48,.06)}
.calgrid button.on:hover{background:var(--maz-red)}
.tcol .step:hover:not(:disabled){background:rgba(31,36,48,.06)}
.card .track{background:rgba(31,36,48,.13)}
.calc{
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-color:rgba(31,36,48,.09);
}
.bhead, .bfoot{border-color:rgba(31,36,48,.09)}

/* กล่องไฟล์แนบ */
.file{
  background:rgba(255,255,255,.42);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-color:rgba(255,255,255,.6);
}

/* หน้าเข้าสู่ระบบ */
.shell, .formside, .scoop{
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(30px) saturate(190%);
  -webkit-backdrop-filter:blur(30px) saturate(190%);
}

/* ตัวเครื่องในหน้าตัวอย่างสถานะบัญชี เป็นภาพจำลองมือถือ ต้องทึบ ไม่ใส่กระจก */

@supports not (backdrop-filter: blur(2px)){
  .drawer,.list,.tip,.cal,.tpop,.box{background:rgba(255,255,255,.98)}
  .shell,.formside,.scoop{background:rgba(255,255,255,.96)}
}

/* ===== เลื่อนทั้งคอลัมน์เนื้อหาเป็นก้อนเดียว ไม่เลื่อนในตาราง (ใช้ร่วมทุกหน้า) ===== */
/* เดิมตารางมีสกรอลล์ของตัวเองซ้อนอยู่ข้างใน เอาออกให้เลื่อนทีเดียวทั้งคอลัมน์
   ตัวที่เลื่อนคือ .main ไม่ใช่ทั้งหน้า เมนูซ้ายเลยอยู่กับที่เสมอ ไม่ต้องพึ่ง sticky
   (ถ้าให้ทั้งหน้ายาวแล้วใช้ sticky เมนูจะหายตอนเลื่อนในกรอบพรีวิวที่สูงเท่าเนื้อหา) */
/* ต้องระบุ main.main เพราะมีปุ่มที่ใช้คลาส main ด้วย ถ้าเขียน .main เฉยๆ ปุ่มจะสูงเท่าจอ */
main.main{height:100vh;overflow:auto}
.panel{flex:none}
.scroll, .scrollarea, .stage{flex:none;min-height:0;overflow:visible}
/* ยกเว้นดรอปดาวน์ค้นหา ต้องเลื่อนในกล่องตัวเองเหมือนเดิม */
.list .scrollarea{max-height:264px;overflow:auto}
/* แถบหัวลอยอยู่บนสุดของคอลัมน์เนื้อหา และต้องทึบพอให้อ่านออกตอนเนื้อหาเลื่อนลอดใต้ */
.appbar, .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86)}
/* แผงเลื่อนข้างและกล่องซ้อนยังเลื่อนในตัวเองตามเดิม */
.drawer .body, .bbody{overflow:auto}
@media print{ .appbar, .topbar{position:static} .main{height:auto;overflow:visible} }

.twrap input.bad, .dwrap input.bad{
  border-color:var(--late);
  background:var(--late-bg);
  color:var(--late);
  font-weight:600;
}
.twrap input.bad ~ .clockbtn, .dwrap input.bad ~ .calbtn{color:var(--late)}

/* ===== มือถือ: ตารางรายการเปลี่ยนเป็นการ์ดต่อแถว (ใช้ร่วมทุกหน้า) =====
   จอ 640px ลงมา ตารางหลายคอลัมน์อ่านยากมากถ้าเลื่อนแนวนอน
   จึงพับแต่ละแถวเป็นการ์ด โดยเอาชื่อคอลัมน์จาก th มาไว้หน้าเซลล์
   ใช้เฉพาะตารางรายการ (.scroll &gt; table) ไม่แตะตารางในเอกสาร A4 หรือตารางกรอกในฟอร์ม */
@media (max-width:640px){
  /* ตารางที่แปลงเป็นการ์ดจะแคบพอดีอยู่แล้ว ส่วนตารางกรอกในฟอร์มยังกว้าง ต้องเลื่อนข้างได้
     ถ้าตั้ง visible เนื้อหาจะถูกตัดหายโดยไม่มีทางเลื่อนไปดู */
  .scroll{overflow-x:auto}
  .scroll &gt; table.grid{min-width:760px}
  .scroll &gt; table:not(.grid){min-width:0!important;display:block;border-collapse:separate;border-spacing:0}
  .scroll &gt; table:not(.grid) &gt; thead{display:none}
  .scroll &gt; table:not(.grid) &gt; tbody{display:block}

  .scroll &gt; table:not(.grid) &gt; tbody &gt; tr{
    display:block;margin:10px 14px;padding:6px 2px;
    border:1px solid var(--line);border-radius:13px;background:var(--white);
  }
  .scroll &gt; table:not(.grid) &gt; tbody &gt; tr &gt; td{
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
    width:auto;border:none;padding:7px 13px;text-align:right;
  }
  .scroll &gt; table:not(.grid) &gt; tbody &gt; tr &gt; td::before{
    content:attr(data-label);flex:none;max-width:44%;
    color:var(--ink-faint);font-size:12px;font-weight:600;text-align:left;line-height:1.5;
  }
  .scroll &gt; table:not(.grid) &gt; tbody &gt; tr &gt; td:not([data-label])::before{content:none}
  .scroll &gt; table:not(.grid) &gt; tbody &gt; tr &gt; td &gt; *{text-align:right}
  .scroll &gt; table:not(.grid) &gt; tbody &gt; tr &gt; td .clip{white-space:normal}

  /* แถวว่างและแถวที่กางรายละเอียดคร่อมทั้งแถว ให้แสดงเต็มความกว้างตามเดิม */
  .scroll &gt; table:not(.grid) &gt; tbody &gt; tr.sub{margin:0;padding:0;border:none;border-radius:0;background:none}
  .scroll &gt; table:not(.grid) &gt; tbody &gt; tr.sub &gt; td{display:block;text-align:left;padding:0}
  .scroll &gt; table:not(.grid) &gt; tbody &gt; tr.sub &gt; td::before{content:none}
  .scroll &gt; table:not(.grid) &gt; tbody &gt; tr &gt; td.blank,
  .scroll &gt; table:not(.grid) &gt; tbody &gt; tr &gt; td.empty{display:block;text-align:center}
  .scroll &gt; table:not(.grid) &gt; tbody &gt; tr &gt; td.blank::before,
  .scroll &gt; table:not(.grid) &gt; tbody &gt; tr &gt; td.empty::before{content:none}

  /* ตารางย่อยข้างในการ์ดยังเป็นตารางปกติ แต่ให้เลื่อนข้างได้ */
  .subwrap{overflow-x:auto}
  table.inner{min-width:560px}


  /* แถบหัวหน้า: ชื่อหน้ากับปุ่มเครื่องมือไม่พอในบรรทัดเดียว ต้องตกบรรทัดแทนการถูกตัดหาย */
  .bar{flex-wrap:wrap;gap:12px}
  .bar .tools{width:100%;flex-wrap:wrap;justify-content:flex-start;gap:9px}
  .bar .tools .mo{flex:1 1 auto;min-width:0;justify-content:space-between}
  .bar .tools .btn, .bar .tools .seg{flex:1 1 auto;justify-content:center}
  .bar h1{font-size:20px}

  /* กริดที่ตั้งความกว้างคอลัมน์เป็นพิกเซลตายตัวไว้ ต้องบีบให้พอดีจอ ไม่งั้นลูกล้นออกไป */
  .shell{grid-template-columns:minmax(0,1fr)!important;max-width:100%!important}
  .pcard, .scoop{max-width:100%!important;width:auto!important;min-width:0}
  .profile{grid-template-columns:1fr!important}
  .facts{grid-template-columns:1fr!important}
  .two, .two-up, .wide-left, .moneygrid{grid-template-columns:1fr!important}

  /* ตารางอื่นที่ไม่ได้อยู่ในกรอบเลื่อน ต้องมีกรอบเลื่อนของตัวเอง */
  .pcard table, .card table{display:block;overflow-x:auto;max-width:100%}

  /* ช่องค้นหาและแถวป้าย-ค่า ตั้งความกว้างตายตัวไว้ ต้องยืดหดตามจอ */
  .search{width:100%!important;min-width:0}
  .search input{width:100%;min-width:0}
  .mrow{flex-wrap:wrap;gap:4px 10px}
  .mrow &gt; span, .mrow &gt; label{width:auto;min-width:120px}
  .card, .panel{min-width:0}

  /* ปุ่มยาวๆ อย่างส่งออก Excel และแถวปุ่มด้านขวาให้ตกบรรทัด ไม่ดันออกนอกจอ */
  .right, .acts, .btnrow{flex-wrap:wrap}
  .btn{white-space:nowrap}
  .bars .bar{max-width:100%}

  /* แถบเลขหน้าและปุ่มสาธิตให้ตกบรรทัดแทนที่จะดันออกนอกจอ */
  .pages{flex-wrap:wrap;justify-content:center}
  .foot{flex-wrap:wrap;gap:10px}
  .demo{flex-wrap:wrap;justify-content:center}

  /* ตารางกรอกในกล่องซ้อน ให้เลื่อนข้างในกล่องแทนที่จะดันกล่องล้นจอ */
  .bbody{overflow-x:auto}
  .bbody table.grid{min-width:420px}

  /* แท็บบนมือถือให้เลื่อนแนวนอนแทนที่จะตกบรรทัด */
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none}
  .strip{flex-wrap:wrap;gap:8px}
  .legend{display:none}
}

/* ===== แท็บเล็ต: กล่องที่ตั้งความกว้างเป็นพิกเซลตายตัวต้องยืดหดตามจอด้วย ===== */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)!important;max-width:100%!important}
  .pcard, .scoop{max-width:100%!important;width:auto!important;min-width:0}
  .pcard table, .card table{display:block;overflow-x:auto;max-width:100%}
}
/* ===== จอแคบมาก: การ์ดสรุปเรียงลงคอลัมน์เดียว ===== */
@media (max-width:420px){
  .cards{grid-template-columns:minmax(0,1fr)!important}
  .cards &gt; *{min-width:0}
  /* กริดหลายคอลัมน์ในแดชบอร์ดเหลือคอลัมน์เดียว ไม่งั้นคอลัมน์กว้างเกินจอ */
  .grid, .grid2, .grid3{grid-template-columns:minmax(0,1fr)!important}
  .grid &gt; *, .grid2 &gt; *, .grid3 &gt; *{min-width:0}
}

  #todoRows &gt; tr.drow &gt; td:nth-child(1){grid-area:cus}
  #todoRows &gt; tr.drow &gt; td:nth-child(1) b{font-size:15.5px}
  #todoRows &gt; tr.drow &gt; td:nth-child(2){grid-area:quo;font-size:12.5px;color:#6E6164}
  #todoRows &gt; tr.drow &gt; td:nth-child(2) .span{font-weight:600;color:#2A1F22;margin-right:6px}
  #todoRows &gt; tr.drow &gt; td:nth-child(3){grid-area:amt;text-align:right!important;font-size:15px}
  #todoRows &gt; tr.drow &gt; td:nth-child(3) b::after{content:&quot; ฿&quot;}
  #todoRows &gt; tr.drow &gt; td:nth-child(4){grid-area:plan;background:#FBF7F7;border-radius:14px;padding:9px 11px!important;font-size:13px}
  #todoRows &gt; tr.drow &gt; td:nth-child(4) .why{display:none}
  #todoRows &gt; tr.drow &gt; td:nth-child(4) .why:only-child{display:block;color:#A3979A}
  #todoRows &gt; tr.drow &gt; td:nth-child(5){grid-area:act;margin-top:4px}
  #todoRows .bx-acts{display:grid!important;grid-template-columns:1fr 1fr;gap:10px;justify-content:stretch!important}
  #todoRows .bx-acts button{height:44px;border-radius:14px!important;border:0!important;font:inherit;font-size:14px!important;font-weight:600!important;text-decoration:none!important;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #todoRows .bx-acts button[data-plan]{background:#F7EFF1!important;color:#2A1F22!important}
  #todoRows .bx-acts button.m-open,#todoRows tr:not(.can) .bx-acts button[data-plan]{background:#D0021B!important;color:#FFF!important;box-shadow:0 10px 18px -12px rgba(208,2,27,.9)}
  #todoRows tr:not(.can) .bx-acts button[data-plan]:only-child{grid-column:1 / -1}
  #todoRows .bx-acts button.bx-cxl{grid-column:1 / -1;order:3;height:auto;background:none!important;color:#C0121F!important;font-size:12.5px!important;padding:2px 0}
  /* งวดที่กางออก */
  #todoRows &gt; tr.sub{display:block!important;margin:-4px 8px 0!important;padding:10px!important;border:0!important;border-radius:0 0 18px 18px!important;background:#FBF1F2!important}
  #todoRows &gt; tr.sub &gt; td{display:block!important;padding:0!important}
  #todoRows .subwrap{overflow:visible!important}
  #todoRows table.inner{min-width:0!important;width:100%;display:block}
  #todoRows table.inner colgroup{display:none}
  #todoRows table.inner tbody{display:flex;flex-direction:column;gap:8px}
  /* แถวงวด: ซ้าย = งวดที่ / % กับจำนวนเงิน, ขวา = ปุ่มออกใบแจ้งหนี้ กลางแนวตั้ง */
  #todoRows table.inner tr{display:grid;grid-template-columns:auto auto 1fr auto;gap:2px 10px;align-items:center;background:#FFF;border-radius:14px;padding:10px 12px}
  #todoRows table.inner tr:empty{display:none}
  #todoRows table.inner td{display:block;padding:0;border:0;font-size:13px;text-align:left!important}
  #todoRows table.inner td:nth-child(1){grid-column:1 / 4;grid-row:1;font-weight:700}
  #todoRows table.inner td:nth-child(2){grid-column:1;grid-row:2;color:#6E6164}
  #todoRows table.inner td:nth-child(3){grid-column:2;grid-row:2;font-weight:700}
  #todoRows table.inner td:nth-child(3)::after{content:&quot; ฿&quot;}
  #todoRows table.inner td:nth-child(4){grid-column:4;grid-row:1 / 3;justify-self:end;align-self:center;text-align:right!important}
  #todoRows table.inner td:nth-child(4) .bx-acts{display:block!important}
  #todoRows table.inner td:nth-child(4) .why{font-size:12px;color:#A3979A}
  #todoRows table.inner td:nth-child(4) button{width:auto;padding:0 18px;height:40px;border:0;border-radius:12px;background:#D0021B;color:#FFF!important;font:inherit;font-size:13.5px;font-weight:600;text-decoration:none!important;cursor:pointer}

  /* ใบแจ้งหนี้ */

  #invRows .bx-cxl{background:none;border:0;color:#C0121F;font:inherit;font-size:12.5px;padding:0}

  /* ค้างชำระ */
  #dueRows &gt; tr{grid-template-areas:&quot;cus late&quot; &quot;no no&quot; &quot;due out&quot; &quot;last last&quot; &quot;act act&quot;}
  #dueRows &gt; tr &gt; td:nth-child(1){grid-area:no;font-size:12px;color:#A3979A}

  #dueRows &gt; tr &gt; td:nth-child(3){grid-area:due}
  #dueRows &gt; tr &gt; td:nth-child(4){grid-area:late;justify-self:end;align-self:start}

  #dueRows &gt; tr &gt; td:nth-child(4) .late::before{content:&quot;เกิน &quot;}

  #dueRows &gt; tr &gt; td:nth-child(3),#dueRows &gt; tr &gt; td:nth-child(5){background:#FBF7F7;border-radius:14px;padding:8px 10px!important}

  #dueRows &gt; tr &gt; td:nth-child(3) .span{font-weight:700}
  #dueRows &gt; tr &gt; td:nth-child(6){grid-area:last;font-size:12.5px;color:#6E6164;background:#FBF5F5;border-radius:12px;padding:8px 10px!important}

&lt;script&gt;

      var b=document.createElement(&#x27;button&#x27;); b.type=&#x27;button&#x27;; b.className=&#x27;m-open&#x27;;
      b.textContent=open?&#x27;ซ่อนงวด&#x27;:&#x27;ออกใบแจ้งหนี้&#x27;;
      var first=acts.querySelector(&#x27;button[data-plan]&#x27;);
      acts.insertBefore(b, first?first.nextSibling:acts.firstChild);

  decorate();
})();

    // ค่าเริ่มต้นแบ่งครึ่ง ใส่จำนวนเงินมาให้เลยไม่ต้องรอผู้ใช้พิมพ์ซ้ำ
    var half=r2(d.net/2);
    var rows = d.plan.length ? d.plan
      : [{seq:1,pct:50,amount:half,due:&#x27;&#x27;},{seq:2,pct:50,amount:r2(d.net-half),due:&#x27;&#x27;}];
    planRows.innerHTML=rows.map(planRowHTML).join(&#x27;&#x27;);
    sumPlan();
  }
  // แก้ได้ทั้งสัดส่วนและจำนวนเงิน ใส่ฝั่งไหนอีกฝั่งคำนวณตาม
  function syncRow(tr, src){
    var d=planFor;
    var pctEl=tr.querySelector(&#x27;.p-pct&#x27;), amtEl=tr.querySelector(&#x27;.p-amt&#x27;);
    if(src===&#x27;pct&#x27;){
      var pct=parseFloat(String(pctEl.value).replace(/,/g,&#x27;&#x27;))||0;
      amtEl.value = pct ? baht(r2(d.net*pct/100)) : &#x27;&#x27;;
    }else{
      var amt=parseFloat(String(amtEl.value).replace(/,/g,&#x27;&#x27;))||0;
      pctEl.value = (amt &amp;&amp; d.net) ? String(Math.round(amt*10000/d.net)/100) : &#x27;&#x27;;
    }
  }
  function sumPlan(){
    var d=planFor, t=0;
    Array.prototype.forEach.call(planRows.querySelectorAll(&#x27;tr&#x27;), function(tr){
      t += parseFloat(String(tr.querySelector(&#x27;.p-amt&#x27;).value).replace(/,/g,&#x27;&#x27;))||0;
    });
    t=r2(t);
    document.getElementById(&#x27;planSum&#x27;).textContent=baht(t);
    var diff=r2(d.net-t);
    var el=document.getElementById(&#x27;planDiff&#x27;);
    // ยอดรวมทุกงวดต้องเท่ากับยอดสุทธิของดีล ตาม BR-03 ของ SL-05
    el.innerHTML = diff===0
      ? &#x27;&lt;span class=&quot;okmsg&quot;&gt;ตรงกับยอดสุทธิ&lt;/span&gt;&#x27;
      : &#x27;&lt;span class=&quot;badmsg&quot;&gt;ต่างจากยอดสุทธิ &#x27;+baht(Math.abs(diff))+&#x27; บาท&lt;/span&gt;&#x27;;
    document.getElementById(&#x27;planSave&#x27;).disabled = diff!==0;
  }

  function openPlan(no){
    planFor=DEALS.filter(function(x){ return x.no===no; })[0];
    if(!planFor) return;
    drawPlan(); planVeil.classList.add(&#x27;on&#x27;);
  }
  function closePlan(){ planVeil.classList.remove(&#x27;on&#x27;); }
  planRows.addEventListener(&#x27;input&#x27;, function(e){
    var tr=e.target.closest(&#x27;tr&#x27;); if(!tr) return;
    if(e.target.classList.contains(&#x27;p-pct&#x27;)){
      e.target.value=e.target.value.replace(/[^\d.]/g,&#x27;&#x27;);
      syncRow(tr,&#x27;pct&#x27;);
    }else if(e.target.classList.contains(&#x27;p-amt&#x27;)){
      e.target.value=e.target.value.replace(/[^\d.,]/g,&#x27;&#x27;);
      syncRow(tr,&#x27;amt&#x27;);
    }
    sumPlan();
  });
  planRows.addEventListener(&#x27;click&#x27;, function(e){
    var b=e.target.closest(&#x27;button[data-del]&#x27;); if(!b) return;
    var rows=readPlan(); rows.splice(+b.getAttribute(&#x27;data-del&#x27;),1);
    planFor.plan=rows; drawPlan();
  });
  document.getElementById(&#x27;planAdd&#x27;).addEventListener(&#x27;click&#x27;, function(){
    var rows=readPlan(); rows.push({seq:rows.length+1,pct:0,amount:0,due:&#x27;&#x27;});
    planFor.plan=rows; drawPlan();
  });
  function readPlan(){
    var d=planFor, out=[];
    Array.prototype.forEach.call(planRows.querySelectorAll(&#x27;tr&#x27;), function(tr,i){
      var pct=parseFloat(String(tr.querySelector(&#x27;.p-pct&#x27;).value).replace(/,/g,&#x27;&#x27;))||0;
      var amt=parseFloat(String(tr.querySelector(&#x27;.p-amt&#x27;).value).replace(/,/g,&#x27;&#x27;))||0;
      var old=(d.plan||[])[i];
      out.push({seq:i+1, pct:pct, amount:r2(amt), due:(old&amp;&amp;old.due)||&#x27;&#x27;});
    });
    return out;
  }
  document.getElementById(&#x27;planClose&#x27;).addEventListener(&#x27;click&#x27;, closePlan);
  document.getElementById(&#x27;planCancel&#x27;).addEventListener(&#x27;click&#x27;, closePlan);
  planVeil.addEventListener(&#x27;click&#x27;, function(e){ if(e.target===planVeil) closePlan(); });
  document.getElementById(&#x27;planSave&#x27;).addEventListener(&#x27;click&#x27;, function(){
    if(document.getElementById(&#x27;planSave&#x27;).disabled) return;
    // TODO: INSERT installment ทุกงวดของดีลนี้
    planFor.plan=readPlan();
    // กางงวดให้เลย ผู้ใช้จะได้เห็นปุ่มออกใบแจ้งหนี้ของงวดแรกทันที ไม่ต้องเดาว่าต้องกดแถวต่อ
    opened[planFor.no]=true;

  // ---------- บันทึกการติดตามหนี้ ----------
  var colVeil=document.getElementById(&#x27;colVeil&#x27;), colFor=null, colChanVal=&#x27;โทรศัพท์&#x27;;
  var colChan=document.getElementById(&#x27;colChan&#x27;), colResult=document.getElementById(&#x27;colResult&#x27;),
      colNext=document.getElementById(&#x27;colNext&#x27;), colDate=document.getElementById(&#x27;colDate&#x27;);

  dueRows.addEventListener(&#x27;click&#x27;, function(e){
    var b=e.target.closest(&#x27;button[data-col]&#x27;); if(!b) return;
    colFor=INVOICES.filter(function(v){ return v.no===b.getAttribute(&#x27;data-col&#x27;); })[0];
    if(!colFor) return;
    document.getElementById(&#x27;colWho&#x27;).innerHTML=&#x27;&lt;span class=&quot;il&quot;&gt;&#x27;+esc(colFor.no)+&#x27;&lt;/span&gt;&#x27;+
      &#x27;&lt;span class=&quot;il&quot;&gt;&#x27;+esc(colFor.cus)+&#x27;&lt;/span&gt;&#x27;+
      &#x27;&lt;span class=&quot;il&quot;&gt;คงเหลือ &#x27;+baht(colFor.outstanding)+&#x27; บาท&lt;/span&gt;&#x27;;
    colDate.value=th(ymd(TODAY));
    colResult.value=&#x27;&#x27;; colNext.value=&#x27;&#x27;; colNext.removeAttribute(&#x27;data-iso&#x27;);
    colChanVal=&#x27;โทรศัพท์&#x27;;
    Array.prototype.forEach.call(colChan.children, function(x){ x.classList.toggle(&#x27;on&#x27;, x.getAttribute(&#x27;data-v&#x27;)===colChanVal); });

  });
  colChan.addEventListener(&#x27;click&#x27;, function(e){

  function closeCol(){ colVeil.classList.remove(&#x27;on&#x27;); }

  document.getElementById(&#x27;colSave&#x27;).addEventListener(&#x27;click&#x27;, function(){
    if(!colResult.value.trim()){ colResult.focus(); return; }
    // TODO: INSERT collection_log
    colFor.col.push({date:ymd(TODAY), channel:colChanVal, result:colResult.value.trim(),
                     next:colNext.getAttribute(&#x27;data-iso&#x27;)||&#x27;&#x27;});
    closeCol(); render();
  });

  // ---------- ปฏิทินไทยร่วม ----------
  var DW=[&#x27;อา&#x27;,&#x27;จ&#x27;,&#x27;อ&#x27;,&#x27;พ&#x27;,&#x27;พฤ&#x27;,&#x27;ศ&#x27;,&#x27;ส&#x27;];
  var cal=document.createElement(&#x27;div&#x27;);
  cal.className=&#x27;cal floatcal&#x27;; document.body.appendChild(cal);
  var calFor=null, calCur=new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);

  function drawCal(){
    var y=calCur.getFullYear(), m=calCur.getMonth();
    var first=new Date(y,m,1).getDay(), last=new Date(y,m+1,0).getDate();
    var sel=calFor ? (calFor.getAttribute(&#x27;data-iso&#x27;)||&#x27;&#x27;) : &#x27;&#x27;;
    var g=DW.map(function(d){ return &#x27;&lt;span class=&quot;dw&quot;&gt;&#x27;+d+&#x27;&lt;/span&gt;&#x27;; }).join(&#x27;&#x27;);
    for(var i=0;i&lt;first;i++) g+=&#x27;&lt;button type=&quot;button&quot; class=&quot;blank&quot; tabindex=&quot;-1&quot;&gt;&lt;/button&gt;&#x27;;
    for(var d=1;d&lt;=last;d++){
      var iso=y+&#x27;-&#x27;+pad(m+1)+&#x27;-&#x27;+pad(d);
      var w=new Date(y,m,d).getDay(), c=[];
      if(w===0||w===6) c.push(&#x27;off&#x27;);
      if(iso===sel) c.push(&#x27;on&#x27;);
      g+=&#x27;&lt;button type=&quot;button&quot; class=&quot;&#x27;+c.join(&#x27; &#x27;)+&#x27;&quot; data-iso=&quot;&#x27;+iso+&#x27;&quot;&gt;&#x27;+d+&#x27;&lt;/button&gt;&#x27;;
    }
    cal.innerHTML=&#x27;&lt;div class=&quot;calhead&quot;&gt;&#x27;+
      &#x27;&lt;button type=&quot;button&quot; class=&quot;calnav&quot; data-mv=&quot;-1&quot; aria-label=&quot;เดือนก่อนหน้า&quot;&gt;&lt;svg width=&quot;14&quot; height=&quot;14&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.4&quot; stroke-linecap=&quot;round&quot;&gt;&lt;path d=&quot;M15 19 8 12l7-7&quot;/&gt;&lt;/svg&gt;&lt;/button&gt;&#x27;+
      &#x27;&lt;b&gt;&#x27;+MON[m]+&#x27; &#x27;+(y+543)+&#x27;&lt;/b&gt;&#x27;+
      &#x27;&lt;button type=&quot;button&quot; class=&quot;calnav&quot; data-mv=&quot;1&quot; aria-label=&quot;เดือนถัดไป&quot;&gt;&lt;svg width=&quot;14&quot; height=&quot;14&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.4&quot; stroke-linecap=&quot;round&quot;&gt;&lt;path d=&quot;m9 5 7 7-7 7&quot;/&gt;&lt;/svg&gt;&lt;/button&gt;&#x27;+
      &#x27;&lt;/div&gt;&lt;div class=&quot;calgrid&quot;&gt;&#x27;+g+&#x27;&lt;/div&gt;&#x27;;
  }
  function openCal(input){
    calFor=input;
    var iso=input.getAttribute(&#x27;data-iso&#x27;);
    calCur = iso ? new Date(parse(iso).getFullYear(), parse(iso).getMonth(), 1)
                 : new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    drawCal(); cal.classList.add(&#x27;on&#x27;);
    var r=input.getBoundingClientRect(), h=cal.offsetHeight;
    var top=r.bottom+6;
    if(top+h &gt; window.innerHeight-8) top=Math.max(8, r.top-h-6);
    cal.style.top=(top+window.scrollY)+&#x27;px&#x27;;
    cal.style.left=Math.min(r.left+window.scrollX, window.innerWidth-296)+&#x27;px&#x27;;
  }
  function closeCal(){ cal.classList.remove(&#x27;on&#x27;); calFor=null; }
  document.addEventListener(&#x27;click&#x27;, function(e){
    var inp=e.target.closest(&#x27;#dueDate, #colNext, #bxFrom, #bxTo, .calbtn&#x27;);
    if(inp){
      e.stopPropagation();
      if(inp.classList.contains(&#x27;calbtn&#x27;)) inp=document.getElementById(inp.getAttribute(&#x27;data-cal&#x27;));
      // เปิดใหม่ทุกครั้ง ไม่สลับเปิดปิดจากสถานะเดิม เพราะ calFor อาจไม่ตรงกับที่เห็นบนจอ
      if(cal.classList.contains(&#x27;on&#x27;) &amp;&amp; calFor===inp) closeCal();
      else openCal(inp);
      return;
    }
    if(!e.target.closest(&#x27;.floatcal&#x27;)) closeCal();
  });
  cal.addEventListener(&#x27;click&#x27;, function(e){
    e.stopPropagation();
    var mv=e.target.closest(&#x27;button[data-mv]&#x27;);
    if(mv){ calCur.setMonth(calCur.getMonth()+parseInt(mv.getAttribute(&#x27;data-mv&#x27;),10)); drawCal(); return; }
    var d=e.target.closest(&#x27;button[data-iso]&#x27;);
    if(!d||!calFor) return;
    var iso=d.getAttribute(&#x27;data-iso&#x27;);
    calFor.setAttribute(&#x27;data-iso&#x27;, iso); calFor.value=th(iso);
    var wasDue = calFor.id===&#x27;dueDate&#x27;;
    closeCal();

  // ---------- เมนูบัญชี ----------
  var meBtn=document.getElementById(&#x27;meBtn&#x27;), meMenu=document.getElementById(&#x27;meMenu&#x27;);

  });
  document.addEventListener(&#x27;click&#x27;, function(e){ if(!meMenu.contains(e.target)) closeMe(); });
  document.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key!==&#x27;Escape&#x27;) return;
    closeMe(); closePlan(); closeCol(); closeCal();
  });

  syncMonthBtns();
  render();
})();
&lt;/script&gt;
&lt;!-- ===== ตารางเป็นการ์ดบนมือถือ (ใส่ร่วมทุกหน้าโดย apply_glass.py) ===== --&gt;
&lt;script&gt;
(function(){
  // บนจอแคบตารางถูกจัดใหม่เป็นการ์ด แต่ละเซลล์ต้องมีป้ายชื่อคอลัมน์ของตัวเอง
  // เพราะหัวตารางถูกซ่อน จึงคัดชื่อจาก th มาใส่เป็น data-label ให้ทุก td
  function label(t){
    var ths = t.querySelectorAll(&#x27;:scope &gt; thead &gt; tr &gt; th&#x27;);
    if(!ths.length) return;
    var rows = t.querySelectorAll(&#x27;:scope &gt; tbody &gt; tr&#x27;);
    Array.prototype.forEach.call(rows, function(tr){
      if(tr.classList.contains(&#x27;sub&#x27;)) return;          // แถวที่กางรายละเอียดคร่อมทั้งแถว ไม่ต้องมีป้าย
      Array.prototype.forEach.call(tr.children, function(td, i){
        if(!ths[i]) return;
        var txt = ths[i].textContent.trim();
        if(txt) td.setAttribute(&#x27;data-label&#x27;, txt);
        else td.removeAttribute(&#x27;data-label&#x27;);
      });
    });
  }
  function run(){
    Array.prototype.forEach.call(document.querySelectorAll(&#x27;.scroll &gt; table&#x27;), label);
  }
  run();
  // ตารางถูกวาดใหม่ด้วย JS ตลอด ต้องติดป้ายใหม่ทุกครั้งที่แถวเปลี่ยน
  if(window.MutationObserver){
    var mo = new MutationObserver(run);
    Array.prototype.forEach.call(document.querySelectorAll(&#x27;.scroll &gt; table &gt; tbody&#x27;), function(tb){
      mo.observe(tb, {childList:true});
    });
  }
})();
&lt;/script&gt;
